<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceNow Incidents Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">ServiceNow Incidents Assistant</h1>
                <p class="subtitle">AI-powered insights from past incidents</p>
            </div>
        </header>

        <main class="main">
            <div class="chat-container">
                <div class="messages" id="messages">
                    <div class="message assistant-message">
                        <div class="message-avatar">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                                <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                                <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="message-content">
                            <p>Hello! I can help you find answers from ServiceNow incidents. Ask me anything about past incidents, resolutions, or common issues.</p>
                        </div>
                    </div>
                </div>

                <div class="input-container">
                    <form id="chatForm" class="chat-form">
                        <input 
                            type="text" 
                            id="userInput" 
                            class="chat-input" 
                            placeholder="Ask about incidents..." 
                            autocomplete="off"
                            required
                        >
                        <button type="submit" class="send-button" id="sendButton">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M2.5 17.5L18.3333 10L2.5 2.5V8.33333L14.1667 10L2.5 11.6667V17.5Z" fill="currentColor"/>
                            </svg>
                        </button>
                    </form>
                </div>
            </div>

            <aside class="sources-panel" id="sourcesPanel" style="display: none;">
                <div class="sources-header">
                    <h3>Sources</h3>
                </div>
                <div class="sources-list" id="sourcesList"></div>
            </aside>
        </main>
    </div>

    <script>
        window.AGENTCORE_ENDPOINT = "{{ agentcore_endpoint }}";
        window.USE_AGENTCORE = {{ use_agentcore | lower }};
    </script>
    <script src="/static/app.js"></script>
</body>
</html>
